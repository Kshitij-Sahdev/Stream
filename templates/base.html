<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAM — {% block title %}Video Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo" id="nav-brand">STREAM</a>
      <nav class="nav-links">
        <a href="/" class="nav-link" id="nav-library">Library</a>
        <a href="/upload" class="nav-link" id="nav-upload">Upload</a>
        <a href="/jobs" class="nav-link" id="nav-jobs">Monitor</a>
      </nav>
    </div>
  </header>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <p>STREAM &mdash; Self-hosted HLS Streaming Platform</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
