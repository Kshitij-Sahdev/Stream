services:
  stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-app
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - PORT=8000
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
